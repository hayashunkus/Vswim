<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pingmove</title>
</head>


<body>
    <canvas id="canvas" style="position:absolute; top:0; right:0; bottom:0; left:0; margin:auto;"></canvas>

    <script src="WWS.js"></script>

    <script>
        //起動時の処理
        function setup() {
            canvasSize(1200, 600);
            loadImg(0, "bg.png");
            loadImg(1, "swimer_pr.png");
            loadImg(2, "swimer_obj.png");
        }
        // プレイヤーがスクロールした距離を追跡
        var totalScrollDistance = 0;
        var stopScroll = false; // スクロール停止フラグ

        //メインループ
        function mainloop() {
            //if (totalScrollDistance < 3600) { // スクロールが3600px未満の場合
            //    drowBG(5);
            //}
            // 毎フレーム、背景を描画
            drowBG(0);  // ここでは背景をスクロールさせずに再描画
            moveSPlayer();
            moveSObject();
        }
        //背景のスクロール
        var bgX = 0;
        function drowBG(spd) {
            if (!stopScroll) { // スクロールが停止していない場合のみスクロール
                bgX = (bgX + spd) % 1200;
                drawImg(0, -bgX, 0);
                drawImg(0, 1200 - bgX, 0);
                if (spd > 0) {
                    totalScrollDistance += spd; // スクロールした距離を加算
                }
            } else {
                drawImg(0, -bgX, 0); // スクロールを停止しても背景は再描画
                drawImg(0, 1200 - bgX, 0);
            }
        }

        //player position
        var spX = 50;
        var spY = 450;
        var playerSpeed = 3;  // プレイヤーの移動速度

        function moveSPlayer() {
            // プレイヤーが右端に到達するまで移動＆スクロール
            if (spX < 1150 && totalScrollDistance < 3600 && !stopScroll) {
                spX += playerSpeed; // プレイヤーを自動的に右に移動
                drowBG(10); // 背景をスクロール
            } else {
                stopScroll = true; // プレイヤーが右端に到達したらスクロールを止める
            }

            drawImgC(1, spX, spY); // プレイヤーを描画
        }

        //object position
        var soX = 50;
        var soY = 550;
        var objectSpeed = 4;

        //object move
        function moveSObject() {
            // オブジェクトが右端に到達するまで移動
            if (soX < 1150 && totalScrollDistance < 3600 && !stopScroll) {
                soX += objectSpeed;
            } else {
                stopScroll = true; // プレイヤーが右端に到達したらスクロールを止める
            }

            drawImgC(2, soX, soY); // オブジェクトを描画
        }



    </script>
</body>

</html>
