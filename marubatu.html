<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 56px);
            /* ナビゲーションバーの高さを引いた中央揃え */
        }

        h1 {
            margin-bottom: 20px;
        }

        table {
            margin-bottom: 20px;
        }

        td.cell {
            width: 100px;
            height: 100px;
            font-size: 50pt;
            text-align: center;
        }
    </style>
    <script>
        let count = 0;
        let gameOver = false;
        function init() {
            let b = document.getElementById("board");
            for (let i = 0; i < 3; i++) {
                let tr = document.createElement("tr");
                for (let j = 0; j < 3; j++) {
                    let td = document.createElement("td");
                    td.className = "cell";
                    td.id = "cell" + i + j;
                    td.onclick = clicked;
                    tr.appendChild(td);
                }
                b.appendChild(tr);
            }
        }
        function clicked(e) {
            if (gameOver) return;
            if (e.target.textContent === "") {
                if (count++ % 2 == 0) {
                    e.target.textContent = "〇";
                } else {
                    e.target.textContent = "×";
                }
                checkWinner();  // 勝者がいるか確認
            }
        }

        function checkWinner() {
            const cells = [];
            for (let i = 0; i < 3; i++) {
                cells[i] = [];
                for (let j = 0; j < 3; j++) {
                    cells[i][j] = document.getElementById("cell" + i + j).textContent;
                }
            }

            // 勝利条件チェック（縦・横・斜め）
            for (let i = 0; i < 3; i++) {
                if (cells[i][0] && cells[i][0] === cells[i][1] && cells[i][1] === cells[i][2]) { // 横
                    gameOver = true;
                    alert(cells[i][0] + "の勝ちです！");
                    return;
                }
                if (cells[0][i] && cells[0][i] === cells[1][i] && cells[1][i] === cells[2][i]) { // 縦
                    gameOver = true;
                    alert(cells[0][i] + "の勝ちです！");
                    return;
                }
            }
            if (cells[0][0] && cells[0][0] === cells[1][1] && cells[1][1] === cells[2][2]) { // 斜め（左上から右下）
                gameOver = true;
                alert(cells[0][0] + "の勝ちです！");
                return;
            }

            if (cells[0][2] && cells[0][2] === cells[1][1] && cells[1][1] === cells[2][0]) { // 斜め（右上から左下）
                gameOver = true;
                alert(cells[0][2] + "の勝ちです！");
                return;
            }
        }

        function resetBoard() {
            let cells = document.getElementsByClassName("cell");
            for (let i = 0; i < cells.length; i++) {
                cells[i].textContent = "";  // 各セルの内容をリセット
            }
            count = 0;  // カウントをリセット
            gameOver = false;
        }
    </script>

</head>

<body onload="init()">
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">名工大V水泳</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#expandme"
            aria-controls="expandme" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="expandme">
            <div class="navbar-nav">
                <a href="index.html" class="nav-item nav-link">ホーム</a>
                <a href="menu.html" class="nav-item nav-link">メニュー</a>
            </div>
        </div>
    </nav>

    <div class="game-container">
        <h1>〇✕ゲーム</h1>
        <table id="board" border="1"></table>
        <button onclick="resetBoard()">reset</button>
    </div>
</body>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
    integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
    crossorigin="anonymous"></script>

</html>
