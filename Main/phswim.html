<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phswim_main</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">名工大V水泳</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#expandme"
            aria-controls="expandme" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="expandme">
            <div class="navbar-nav">
                <a href="home.html" class="nav-item nav-link">ホーム</a>
                <a href="menu.html" class="nav-item nav-link">メニュー</a>
            </div>
        </div>
    </nav>
    <div id="controls">
        <h2>ストロークシミュレーション</h2>
        <button onclick="changeSpeed(0.04)">速度: 1</button>
        <button onclick="changeSpeed(0.08)">速度: 2</button>
        <button onclick="changeSpeed(0.10)">速度: 3</button>
        <button onclick="moveForward(10)">前進</button>
        <button onclick="resetAnimation()">リセット</button>
    </div>

    <div id="inputs">
        <p>
            <label for="high">身長　　　　　　　</label>
            <input type="text" name="high" id="high" placeholder="120 - 220 cm">
        </p>
        <p>
            <label for="weight">体重　　　　　　　</label>
            <input type="text" name="weight" id="weight" placeholder="30 - 120 kg">
        </p>
        <p>
            <label for="strt">ストロークテンポ　</label>
            <input type="text" name="strt" id="strt" placeholder="0.3 - 2.0 回/s">
        </p>
        <p>
            <label for="strl">ストローク長　　　</label>
            <input type="text" name="strl" id="strl" placeholder="0.3 - 2.0 m/回">
        </p>
    </div>

    <div id="result">速度: 0 m/s<br> 50m time: 0s<br> 抵抗力 R: 0 N<br>パワー P: 0 W<br>ストロークテンポ: 0 回/s<br>角速度(speed):0 rad/fps
    </div>

    <!-- 結果出力ボタンを追加 -->
    <button id="output-btn" onclick="calculateAndDisplayResults()">結果出力</button>


    <canvas id="graph" width="1250" height="600"></canvas>
    <script src="strokepng.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous">
        </script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous">
        </script>

</body>

</html>
