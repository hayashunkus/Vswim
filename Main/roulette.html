<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルーレット</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
        }

        h2 {
            text-align: center;
            font-size: 24px;
        }

        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .roulette-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 2px solid #007bff;
            border-radius: 50%;
            background-color: #ffffff;
        }

        .roulette {
            width: 100%;
            height: 100%;
            border: 5px solid rgb(50, 120, 180);
            border-radius: 50%;
            background: conic-gradient(rgb(240, 145, 70) 0% 40%, rgb(150, 220, 150) 40% 70%, rgb(145, 130, 230) 70% 90%, rgb(172, 205, 236) 90% 100%);
        }

        .needle {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 50px;
            background: rgb(220, 50, 120);
            transform-origin: bottom;
            transform: translateX(-50%);
        }

        .button-group {
            position: fixed;
            top: 300px;
            left: 30px;
        }

        .button-group button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">名工大V水泳</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#expandme"
            aria-controls="expandme" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="expandme">
            <div class="navbar-nav">
                <a href="index.html" class="nav-item nav-link">ホーム</a>
                <a href="menu.html" class="nav-item nav-link">メニュー</a>
            </div>
        </div>
    </nav>
    <h1>VScode de Arm wrestling</h1>
    <h2>　注）1回だけまわしてください<br>　【オレンジ】vs ハヤシュン　【緑】vsしまゆー　【紫】vs h_ryo　【水色】vs いぬかき
        <br>ハヤシュンかしまゆーに勝てたら景品ゲット!!（数量限定） <br>チャレンジは何回でもOK!!
    </h2>
    <div class="content">
        <div class="roulette-container">
            <div class="roulette" id="roulette1"></div>
            <div class="needle" id="needle"></div>
        </div>
        <div class="button-group">
            <button id="spinButton">ルーレットをまわす</button>
            <button id="resetButton">リセット</button>
        </div>
    </div>


    <script>
        let clickCount = 0;
        const maxClicks = 1;

        // ルーレットを回す処理
        document.getElementById('spinButton').addEventListener('click', function () {
            if (clickCount < maxClicks) {
                clickCount++;
                const roulette = document.getElementById('roulette1');
                const randomDegree = Math.floor(Math.random() * 360);
                roulette.style.transition = 'transform 3s ease-out';
                roulette.style.transform = `rotate(${randomDegree + 360 * 20}deg)`; // Spin at least 20 full rotations

                if (clickCount >= maxClicks) {
                    setTimeout(() => {
                        alert('これ以上回すことはできません.');
                        this.disabled = true; // Disable the spin button after 1 clicks and show alert
                    }, 3000); // Delay to ensure the alert appears after the spinning ends
                }
            }
        });


        // リセット処理
        document.getElementById('resetButton').addEventListener('click', function () {
            clickCount = 0;
            const roulette = document.getElementById('roulette1');
            roulette.style.transition = 'none'; // Transitionを一時的に無効化
            roulette.style.transform = 'rotate(0deg)'; // 初期位置に戻す
            document.getElementById('spinButton').disabled = false; // Spinボタンを有効化
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>
</body>

</html>
