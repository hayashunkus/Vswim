<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette with Limited Spins</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .roulette-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px;
        }

        .roulette {
            width: 100%;
            height: 100%;
            border: 5px solid rgb(50, 120, 180);
            border-radius: 50%;
            background: conic-gradient(rgb(250, 150, 150) 0% 40%, rgb(150, 220, 150) 40% 75%, rgb(150, 140, 200) 75% 100%);
        }

        .needle {
            position: absolute;
            top: 0;
            left: 50%;
            width: 5px;
            height: 50px;
            background: rgb(220, 50, 120);
            transform-origin: bottom;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <div class="roulette-container">
        <div class="roulette" id="roulette1"></div>
        <div class="needle" id="needle"></div>
    </div>
    <button id="spinButton">Spin Roulette</button>

    <script>
        let clickCount = 0;
        const maxClicks = 4;

        document.getElementById('spinButton').addEventListener('click', function () {
            if (clickCount < maxClicks) {
                clickCount++;
                const roulette = document.getElementById('roulette1');
                const randomDegree = Math.floor(Math.random() * 360);
                roulette.style.transition = 'transform 3s ease-out';
                roulette.style.transform = `rotate(${randomDegree + 360 * 10}deg)`; // Spin at least 10 full rotations

                if (clickCount >= maxClicks) {
                    this.disabled = true; // Disable the button after 4 clicks
                    alert('これ以上回すことはできません.');
                }
            }
        });
    </script>
</body>

</html>
