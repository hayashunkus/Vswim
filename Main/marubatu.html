<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        td.cell {
            width: 100px;
            height: 100px;
            font-size: 60pt;
            text-align: center;
        }
    </style>
    <script>
        let count = 0;
        let gameOver = false;
        function init() {
            let b = document.getElementById("board");
            for (let i = 0; i < 3; i++) {
                let tr = document.createElement("tr");
                for (let j = 0; j < 3; j++) {
                    let td = document.createElement("td");
                    td.className = "cell";
                    td.id = "cell" + i + j;
                    td.onclick = clicked;
                    tr.appendChild(td);
                }
                b.appendChild(tr);
            }
        }
        function clicked(e) {
            if (gameOver) return;
            if (e.target.textContent === "") {
                if (count++ % 2 == 0) {
                    e.target.textContent = "〇";
                } else {
                    e.target.textContent = "×";
                }
                checkWinner();  // 勝者がいるか確認
            }
        }

        function checkWinner() {
            const cells = [];
            for (let i = 0; i < 3; i++) {
                cells[i] = [];
                for (let j = 0; j < 3; j++) {
                    cells[i][j] = document.getElementById("cell" + i + j).textContent;
                }
            }

            // 勝利条件チェック（縦・横・斜め）
            for (let i = 0; i < 3; i++) {
                if (cells[i][0] && cells[i][0] === cells[i][1] && cells[i][1] === cells[i][2]) { // 横
                    gameOver = true;
                    alert(cells[i][0] + "の勝ちです！");
                    return;
                }
                if (cells[0][i] && cells[0][i] === cells[1][i] && cells[1][i] === cells[2][i]) { // 縦
                    gameOver = true;
                    alert(cells[0][i] + "の勝ちです！");
                    return;
                }
            }
            if (cells[0][0] && cells[0][0] === cells[1][1] && cells[1][1] === cells[2][2]) { // 斜め（左上から右下）
                gameOver = true;
                alert(cells[0][0] + "の勝ちです！");
                return;
            }

            if (cells[0][2] && cells[0][2] === cells[1][1] && cells[1][1] === cells[2][0]) { // 斜め（右上から左下）
                gameOver = true;
                alert(cells[0][2] + "の勝ちです！");
                return;
            }
        }

        function resetBoard() {
            let cells = document.getElementsByClassName("cell");
            for (let i = 0; i < cells.length; i++) {
                cells[i].textContent = "";  // 各セルの内容をリセット
            }
            count = 0;  // カウントをリセット
            gameOver = false;
        }
    </script>
</head>

<body onload="init()">
    <table id="board" border="1"></table>
    <button onclick="resetBoard()">reset</button>
</body>

</html>
