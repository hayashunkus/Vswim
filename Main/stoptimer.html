<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stopTimer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
            height: 100vh;
            flex-direction: column;
            background-color: #c7e0fa;
        }

        .stopwatch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 0;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #clock-face {
            position: relative;
            width: 200px;
            height: 200px;
            border: 8px solid #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        #needle {
            position: absolute;
            width: 4px;
            height: 80px;
            background-color: red;
            top: 15px;
            transform-origin: 50% 100%;
            transform: rotate(0deg);
        }

        #counter {
            font-size: 2em;
            margin: 0;
            background-color: #e9ecef;
            padding: 10px 20px;
            border-radius: 5px;
            width: 100px;
            text-align: center;
        }

        .button-group button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">名工大V水泳</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#expandme"
            aria-controls="expandme" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="expandme">
            <div class="navbar-nav">
                <a href="index.html" class="nav-item nav-link">ホーム</a>
                <a href="menu.html" class="nav-item nav-link">メニュー</a>
            </div>
        </div>
    </nav>
    <div class="stopwatch-container">
        <h1 id="counter">0.00</h1>
        <div id="clock-face">
            <div id="needle"></div>
        </div>
        <div class="button-group">
            <button id="startStopButton" onclick="toggleTimer()">スタート/ストップ</button>
            <button onclick="reset()">リセット</button>
        </div>
    </div>
    <h2>「スタート/ストップ」ボタンはそれぞれ１回ずつしか押せません。<br>注）４秒後に数字の表示と針の表示が見えなくなります。
        <br>　10秒チャレンジの誤差-0.1～+0.1でお菓子（ルマンド）がもらえます。<br>　チャレンジは３回だよ。
    </h2>
    <script>
        let timerId = NaN;
        let count = 0;
        let needleAngle = 0;
        let isRunning = false;
        let canStartAgain = true;
        const needle = document.getElementById("needle");
        const counter = document.getElementById("counter");
        const startStopButton = document.getElementById("startStopButton");

        function toggleTimer() {
            if (!canStartAgain) return; // ボタンが再度押せないようにする

            if (isRunning) {
                stopTimer();
                isRunning = false;
                canStartAgain = false; // 二度とスタートできないようにする
                startStopButton.disabled = true; // ボタンを無効化
            } else {
                startTimer();
                isRunning = true;
            }
        }

        function startTimer() {
            clearInterval(timerId);
            timerId = setInterval(tick, 10);
        }

        function stopTimer() {
            clearInterval(timerId);
            showElements(); // 表示を戻す
        }

        function tick() {
            count += 0.01;
            counter.textContent = count.toFixed(2);

            needleAngle = (count % 1) * 360;
            needle.style.transform = `rotate(${needleAngle}deg)`;

            if (count >= 4.00) {
                hideElements();
            }
        }

        function reset() {
            clearInterval(timerId);
            count = 0;
            needleAngle = 0;
            counter.textContent = count.toFixed(2);
            needle.style.transform = `rotate(0deg)`;
            showElements();
            isRunning = false;
            canStartAgain = true;
            startStopButton.disabled = false; // ボタンを再び有効化
        }

        function hideElements() {
            needle.style.visibility = "hidden";
            counter.style.visibility = "hidden";
        }

        function showElements() {
            needle.style.visibility = "visible";
            counter.style.visibility = "visible";
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>
</body>

</html>
