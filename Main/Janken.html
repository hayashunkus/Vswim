<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>じゃんけんゲーム</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
        integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <style>
        body {
            margin: 0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 56px);
            /* ナビゲーションバーを除く高さ */
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            /* ボタン間の間隔 */
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
        }

        #result {
            margin-top: 20px;
            font-size: 32px;
        }
    </style>
</head>

<body>
    <!-- ナビゲーションバー -->
    <nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="#">名工大V水泳</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#expandme"
            aria-controls="expandme" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="expandme">
            <div class="navbar-nav">
                <a href="home.html" class="nav-item nav-link">ホーム</a>
                <a href="menu.html" class="nav-item nav-link">メニュー</a>
            </div>
        </div>
    </nav>
    <h3>10回やって7回CPUに買ったらお菓子（うまい棒）ゲット</h3>
    <!-- じゃんけんゲーム部分 -->
    <div class="game-container">
        <h1>じゃんけんゲーム</h1>
        <p>選んでください:</p>
        <div class="buttons-container">
            <button onclick="playGame('グー✊')">✊グー</button>
            <button onclick="playGame('チョキ🤞')">🤞チョキ</button>
            <button onclick="playGame('パー✋')">✋パー</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        function playGame(userChoice) {
            const choices = ['グー✊', 'チョキ🤞', 'パー✋'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];

            let result = '';
            if (userChoice === computerChoice) {
                result = '引き分け！';
            } else if (
                (userChoice === 'グー✊' && computerChoice === 'チョキ🤞') ||
                (userChoice === 'チョキ🤞' && computerChoice === 'パー✋') ||
                (userChoice === 'パー✋' && computerChoice === 'グー✊')
            ) {
                result = 'あなたの勝ち！';
            } else {
                result = 'あなたの負け！';
            }

            document.getElementById('result').innerHTML = `
                あなた: ${userChoice}<br>
                コンピュータ: ${computerChoice}<br>
                ${result}
            `;
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>
</body>

</html>
