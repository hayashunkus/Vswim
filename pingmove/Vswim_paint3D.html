<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vswim_paint3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <button onclick="startTimer()">スタート</button>
    <button onclick="stopTimer()">ストップ</button>
    <button onclick="reset()">リセット</button>
    <h1 id="counter">0.00</h1>
    <h2 id="lap">ラップタイム: N/A</h2>

    <canvas id="graph"></canvas>

    <script>
        let timerId = NaN;
        let count = 0;
        let clock = 0;
        let canvasWidth, canvasHeight;
        let boatX;
        let speed = 2;
        let direction = 1; // 1: 右へ移動, -1: 左へ移動
        let waveDirection = 1; // 波の流れの方向

        function init() {
            var canvas = document.getElementById("graph");
            ctx = canvas.getContext("2d");
            ctx.font = "24px sans-serif";
            resizeCanvas();
            boatX = 0; // ボートの初期位置は左端に設定

            // ウィンドウのリサイズに対応
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            var canvas = document.getElementById("graph");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
        }

        function tick() {
            count += 0.01;
            clock += waveDirection; // 波の動きは現在の方向で進める
            boatX += speed * direction; // ボートを方向に応じて移動

            if (boatX >= canvasWidth) {
                // 右端に到達した場合、ラップタイムを記録し、折り返す
                document.getElementById("lap").textContent = "ラップタイム: " + count.toFixed(2) + " 秒";
                direction = -1; // 左に移動
                waveDirection = -1; // 波も反転
            } else if (boatX <= 0) {
                // 左端に到達した場合、タイマーを停止
                stopTimer();
            }

            document.getElementById("counter").textContent = count.toFixed(2);
            paint(); // 波とボートを描画
        }

        function startTimer() {
            clearInterval(timerId);
            timerId = setInterval(tick, 10);
        }

        function stopTimer() {
            clearInterval(timerId);
        }

        function reset() {
            clearInterval(timerId);
            count = 0;
            clock = 0;
            boatX = 0; // ボートの位置を左端にリセット
            direction = 1; // 右へ移動をリセット
            // waveDirection = 1; // 波の流れもリセット
            document.getElementById("counter").textContent = count.toFixed(2);
            document.getElementById("lap").textContent = "ラップタイム: N/A";
            paint();
        }

        function paintWave(degree, amplitude, color) {
            var boatY = 0;
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, canvasHeight);

            // 画面幅に対応する波の描画
            for (var i = 0; i <= canvasWidth; i += 20) {
                var y = Math.sin((i + degree) * Math.PI / 180) * amplitude + canvasHeight / 1.5;
                ctx.lineTo(i, y);

                // ボートのY座標を取得（ボートの位置に合わせて）
                if (i >= boatX - 10 && i <= boatX + 10) {
                    boatY = y;
                }
            }
            ctx.lineTo(canvasWidth, canvasHeight);
            ctx.fill();
            return boatY;
        }

        function paint() {
            // キャンバスをクリアしてから再描画
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // 波の描画
            var y0 = paintWave(clock * waveDirection, 40, "#0000ff");
            var y1 = paintWave(clock * 2.5 * waveDirection, 30, "#0022CC");
            var y2 = paintWave(clock * 3 * waveDirection, 20, "#2200DD");

            // 各波のボート位置の最大値を取得してボートを表示
            var boatY = Math.min(y0, y1, y2);

            // ボートの描画（丸くして移動）
            ctx.fillStyle = "green";
            ctx.beginPath();
            ctx.arc(boatX, boatY - 20, 20, 0, Math.PI * 2); // ボートを丸く描画
            ctx.fill();
        }

        window.onload = init;
    </script>
</body>

</html>
