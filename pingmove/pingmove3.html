<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pingmove3 with Countdown and Rectangles</title>
    <style>
        #startButton,
        #resetButton {
            position: absolute;
            top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #startButton {
            left: 40%;
            transform: translateX(-40%);
        }

        #resetButton {
            left: 60%;
            transform: translateX(-60%);
        }

        #resetButton:disabled,
        #startButton:disabled {
            background-color: #cccccc;
        }

        #times {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: black;
        }

        #countdown {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: red;
        }

        /* 戻るボタンのスタイル */
        #backButton {
            position: fixed;
            /* 画面の左上に固定表示 */
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            /* ボタンの背景色（青） */
            color: white;
            /* テキスト色 */
            border: none;
            border-radius: 5px;
            /* ボタンの角を丸くする */
            cursor: pointer;
            z-index: 1000;
            /* ボタンを最前面に表示 */
        }

        #backButton:hover {
            background-color: #0056b3;
            /* ホバー時の背景色を濃く */
        }
    </style>
</head>

<body>
    <!-- キャンバスとスタートボタン -->
    <canvas id="canvas" style="position:absolute; top:0; right:0; bottom:0; left:0; margin:auto;"></canvas>
    <button id="startButton" onclick="startGame()">Start</button>
    <button id="resetButton" onclick="resetGame()" disabled>Reset</button> <!-- リセットボタン -->
    <!-- 戻るボタン -->
    <button id="backButton" onclick="navigateBack()">戻る</button>

    <div id="times"></div> <!-- タイムを表示する場所 -->
    <div id="countdown"></div> <!-- カウントダウンを表示する場所 -->

    <script src="WWS.js"></script>

    <script>
        // タイム関連の変数
        var playerStartTime, objectStartTime; // スタート時刻
        var playerEndTime, objectEndTime; // 到達時刻

        // ゲーム開始フラグ
        var gameStarted = false;

        // 四角形のカウント
        var rectangleCount = 0;

        // キーボード関連
        var spacePressCount = 0; // スペースキーが押された回数
        var maxRectangles = 5; // 最大で表示する四角形の数
        var playerSpeed = 0.4; // プレイヤーのスピード
        var speedBoost = 4; // プレイヤーのスピードを倍にするための係数

        // カウントダウン関連
        var countdown = 3;
        var countdownInterval;

        // 起動時の処理
        function setup() {
            canvasSize(1200, 600);
            loadImg(0, "bg.png");
            loadImg(1, "swimer_pr.png");
            loadImg(2, "swimer_obj.png");
        }

        // プレイヤーとオブジェクトがスクロールした距離を追跡
        var totalScrollDistance = 0;
        var stopScroll = false; // スクロール停止フラグ
        var playerReachedEnd = false; // プレイヤーが右端に到達したか
        var objectReachedEnd = false; // オブジェクトが右端に到達したか


        let lastFrameTime = performance.now();
        // メインループ
        function mainloop() {

            let currentTime = performance.now();
            let deltaTime = (currentTime - lastFrameTime) / 1000; // 前のフレームからの経過時間（秒単位）
            lastFrameTime = currentTime;

            // deltaTimeが異常に大きくならないように制限（例えば、1秒以上の遅れは無視）
            if (deltaTime > 1) {
                deltaTime = 1;
            }

            if (gameStarted) {
                // 背景を描画
                drowBG(0);  // 背景は毎フレーム再描画

                // プレイヤーまたはオブジェクトのいずれかが端に到達していない場合にスクロール
                if (!playerReachedEnd && !objectReachedEnd) {
                    drowBG(0.2); // 背景を少し速くスクロール
                }

                moveSPlayer(deltaTime);
                moveSObject(deltaTime);
                if (!playerReachedEnd) {
                    drawRectangles(); // プレイヤーが右端に到達していない場合のみ四角形を描画
                }
                displayCountdown(); // カウントダウンを表示
            }

            requestAnimationFrame(mainloop); // メインループを継続
        }

        // 背景のスクロール
        var bgX = 0;
        function drowBG(spd) {
            if (!stopScroll) { // スクロールが停止していない場合のみスクロール
                bgX = (bgX + spd) % 1200;
                drawImg(0, -bgX, 0);
                drawImg(0, 1200 - bgX, 0);
                if (spd > 0) {
                    totalScrollDistance += spd; // スクロールした距離を加算
                }
            } else {
                drawImg(0, -bgX, 0); // スクロールを停止しても背景は再描画
                drawImg(0, 1200 - bgX, 0);
            }
        }

        // プレイヤーのポジション
        var spX = 50;
        var spY = 450;
        var playerReachedEnd = false; // プレイヤーが右端に到達したかどうかのフラグ
        var playerSpeed = 0.4; // プレイヤーの移動速度

        function moveSPlayer(deltaTime) {
            if (spX < 1150) {
                spX += playerSpeed * deltaTime * 60; // フレームごとの時間差を補正して移動速度を安定化
            } else if (!playerReachedEnd) {
                playerReachedEnd = true; // プレイヤーが右端に到達したらフラグを立てる
                playerEndTime = performance.now(); // プレイヤーの到達時刻を記録
                displayTimes(); // タイムを表示

                // オブジェクトのスピードを1.5倍にする
                objectSpeed *= 1.5;
            }

            drawImgC(1, spX, spY); // プレイヤーを描画
        }

        // オブジェクトのポジション
        var soX = 50;
        var soY = 550;
        var objectSpeed = 0.5;
        var objectReachedEnd = false; // オブジェクトが右端に到達したかどうかのフラグ

        // オブジェクトの移動
        function moveSObject(deltaTime) {
            if (soX < 1150) {
                soX += objectSpeed * deltaTime * 60;
            } else if (!objectReachedEnd) {
                objectReachedEnd = true; // オブジェクトが右端に到達したらフラグを立てる
                objectEndTime = performance.now(); // オブジェクトの到達時刻を記録
                displayTimes(); // タイムを表示
            }

            drawImgC(2, soX, soY); // オブジェクトを描画
        }


        // 四角形を描画する（プレイヤーの上に）
        function drawRectangles() {
            for (let i = 0; i < rectangleCount; i++) {
                fRect(spX - 20 + i * 30, spY - 70, 20, 50, colorRGB(20, 200, 20));  // プレイヤーの上に四角形を描画
            }
        }

        // カウントダウンを表示する
        function displayCountdown() {
            document.getElementById("countdown").innerText = countdown;
        }

        // カウントダウンを開始する
        function startCountdown() {
            countdown = 3;
            displayCountdown();

            countdownInterval = setInterval(function () {
                countdown--;
                displayCountdown();

                if (countdown <= 0) {
                    clearInterval(countdownInterval); // カウントダウン終了
                    window.addEventListener("keydown", handleKeyPress); // スペースキーの入力を再度受け付ける
                }
            }, 1000);
        }

        // ゲーム開始処理
        function startGame() {
            playerStartTime = performance.now(); // プレイヤーのスタート時刻を記録
            objectStartTime = performance.now(); // オブジェクトのスタート時刻を記録

            gameStarted = true;
            playerReachedEnd = false;
            objectReachedEnd = false;
            spX = 50; // プレイヤーの位置を初期化
            soX = 50; // オブジェクトの位置を初期化
            rectangleCount = 0; // 四角形の数をリセット

            document.getElementById("startButton").disabled = true; // ボタンを無効化
            document.getElementById("resetButton").disabled = false; // リセットボタンを有効化

            startCountdown(); // カウントダウンを開始
        }

        // キー入力処理
        function handleKeyPress(event) {
            if (event.code === "Space" && countdown === 0) {
                spacePressCount++;
                if (spacePressCount === 15 && rectangleCount < maxRectangles) {
                    rectangleCount++; // 15回押されたら四角形を増やす
                    spacePressCount = 0; // カウントをリセット
                    startCountdown(); // 新しいカウントダウンを開始
                }
            }

            if (event.code === "Enter" && rectangleCount === 5) {
                playerSpeed *= speedBoost; // スピードを2倍にする
            }
        }

        // タイムを表示する
        function displayTimes() {
            if (playerReachedEnd && objectReachedEnd) {
                var playerTime = (playerEndTime - playerStartTime) / 1000;
                var objectTime = (objectEndTime - objectStartTime) / 1000;

                document.getElementById("times").innerText = `Player Time: ${playerTime.toFixed(2)} seconds, Object Time: ${objectTime.toFixed(2)} seconds`;

                document.getElementById("startButton").disabled = false; // ゲームが終了したらボタンを再び有効化
            }
        }

        // リセット処理
        function resetGame() {
            spX = 50;
            soX = 50;
            playerReachedEnd = false;
            objectReachedEnd = false;
            gameStarted = false;

            document.getElementById("times").innerText = "";
            rectangleCount = 0; // 四角形をリセット
            document.getElementById("countdown").innerText = ""; // カウントダウンをクリア

            document.getElementById("startButton").disabled = false;
            document.getElementById("resetButton").disabled = true;
        }

        // メインループの開始
        setup();
        mainloop();

        // ボタンをクリックしたときに画面遷移
        function navigateBack() {
            window.location.href = "choice.html"; // 遷移先のHTMLファイル名を指定
        }
    </script>

</body>

</html>

<!--相対速度+プレイヤーの速度に合わせてスクロールとストロークの描画と飛び込みスタートと壁の設置とブーストモードの改良とグラフィックの改善と物理の法則を利用-->
