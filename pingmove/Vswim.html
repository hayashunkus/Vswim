<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vswim</title>
</head>

<body>
    <h1>Vswim</h1>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>


    <canvas id="waveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Canvasのサイズをウィンドウの幅と高さに設定
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let waveOffset = 0;
        const waveSpeed = -4.0; // サイン波の流れる速度
        const swimmerSpeed = 1.0; // スイマーの速度
        const waveAmplitude = 20; // サイン波の振幅
        const waveFrequency = 0.01; // サイン波の周波数
        const swimmerRadius = 10; // スイマーの円の半径

        function drawSineWave() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);

            // サイン波の描画
            for (let x = 0; x < canvas.width; x++) {
                const y = canvas.height / 2 + Math.sin(x * waveFrequency + waveOffset) * waveAmplitude;
                ctx.lineTo(x, y);
            }

            ctx.strokeStyle = '#00f';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        let swimmerX = 100; // スイマーの初期位置
        function drawSwimmer() {
            const swimmerY = canvas.height / 2 + Math.sin(swimmerX * waveFrequency + waveOffset) * waveAmplitude - swimmerRadius;

            // スイマー（円）の描画
            ctx.beginPath();
            ctx.arc(swimmerX, swimmerY, swimmerRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4500';
            ctx.fill();
        }

        function animate() {
            waveOffset -= waveSpeed * waveFrequency; // 波を左に移動させる
            swimmerX += swimmerSpeed; // スイマーを右に移動させる

            if (swimmerX > canvas.width) {
                swimmerX = 0; // スイマーが画面外に出たら、左側に戻す
            }

            drawSineWave();
            drawSwimmer();

            requestAnimationFrame(animate);
        }

        // ウィンドウのリサイズに対応
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // アニメーション開始
        animate();
    </script>
</body>

</html>
