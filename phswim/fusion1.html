<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pingmove3 with Stroke Animation</title>
    <style>
        #startButton,
        #resetButton {
            position: absolute;
            top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        #startButton {
            left: 40%;
            transform: translateX(-40%);
        }

        #resetButton {
            left: 60%;
            transform: translateX(-60%);
        }

        #resetButton:disabled,
        #startButton:disabled {
            background-color: #cccccc;
        }

        #times,
        #countdown {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: black;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="1200" height="600"
        style="position:absolute; top:0; right:0; bottom:0; left:0; margin:auto;"></canvas>
    <button id="startButton" onclick="startGame()">Start</button>
    <button id="resetButton" onclick="resetGame()" disabled>Reset</button>
    <div id="times"></div>
    <div id="countdown"></div>

    <script>
        // 初期設定
        let r = 30;
        let angle1 = 0, angle2 = Math.PI;
        let leftLegAngle = -Math.PI / 6, rightLegAngle = Math.PI / 6;
        let leftLegDirection = 0.08, rightLegDirection = -0.08;

        // ゲームステータス
        let gameStarted = false, playerReachedEnd = false, objectReachedEnd = false;
        let spX = 50, spY = 450, soX = 50, soY = 550, playerSpeed = 2, objectSpeed = 1.5;
        let bgX = 0; // 背景のスクロール位置

        // キャンバスとコンテキスト
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // 描画関数
        function drawArm(x, y, angle, isLeft) {
            const shoulderX = x, shoulderY = y;
            let elbowX, elbowY, handX, handY;

            if (Math.sin(angle) < 0) {
                elbowX = shoulderX + Math.cos(angle) * 2 * r;
                elbowY = shoulderY + Math.sin(angle) * 2 * r;
                handX = elbowX + Math.cos(angle) * 2 * r;
                handY = elbowY + Math.sin(angle) * 2 * r;
            } else {
                elbowX = shoulderX + Math.cos(angle) * 2.5 * r;
                elbowY = shoulderY + Math.sin(angle) * 2.5 * r;
                handX = elbowX + Math.cos(angle + Math.PI / 12) * 1.5 * r;
                handY = elbowY + Math.sin(angle + Math.PI / 12) * 1.5 * r;
            }

            ctx.beginPath();
            ctx.moveTo(shoulderX, shoulderY);
            ctx.lineTo(elbowX, elbowY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(elbowX, elbowY);
            ctx.lineTo(handX - (isLeft ? 0.2 : -0.2) * r, handY + 2 / 3 * r);
            ctx.stroke();
        }

        function drawLeg(x, y, angle) {
            const footX = x - Math.cos(angle) * r;
            const footY = y - Math.sin(angle) * r;
            const ankleX = footX - Math.cos(angle) * r;
            const ankleY = footY - Math.sin(angle) * r;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(footX, footY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(footX, footY);
            ctx.lineTo(ankleX, ankleY);
            ctx.stroke();
        }

        // 背景のスクロール描画
        function drawBackground() {
            ctx.fillStyle = "#e0f7fa"; // 背景色を設定
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            bgX -= 1; // スクロール速度
            if (bgX <= -canvas.width) bgX = 0; // ループ
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground(); // 背景を描画

            if (gameStarted) {
                if (!playerReachedEnd) {
                    spX += playerSpeed;
                    drawArm(spX, spY, angle1, true);
                    drawArm(spX, spY, angle2, false);
                    drawLeg(spX, spY, leftLegAngle);
                    drawLeg(spX, spY, rightLegAngle);

                    if (spX >= canvas.width - 100) playerReachedEnd = true;
                }

                if (!objectReachedEnd) {
                    soX += objectSpeed;
                    drawLeg(soX, soY, rightLegAngle);
                    if (soX >= canvas.width - 100) objectReachedEnd = true;
                }

                angle1 += 0.10;
                angle2 += 0.10;
                leftLegAngle += leftLegDirection;
                rightLegAngle += rightLegDirection;

                if (leftLegAngle > Math.PI / 6 || leftLegAngle < -Math.PI / 6) leftLegDirection *= -1;
                if (rightLegAngle > Math.PI / 6 || rightLegAngle < -Math.PI / 6) rightLegDirection *= -1;
            }

            requestAnimationFrame(animate);
        }

        // ゲーム開始とリセット
        function startGame() {
            gameStarted = true;
            playerReachedEnd = false;
            objectReachedEnd = false;
            spX = 50; soX = 50;
            document.getElementById("startButton").disabled = true;
            document.getElementById("resetButton").disabled = false;
        }

        function resetGame() {
            gameStarted = false;
            playerReachedEnd = false;
            objectReachedEnd = false;
            spX = 50; soX = 50;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById("startButton").disabled = false;
            document.getElementById("resetButton").disabled = true;
        }

        animate();
    </script>
</body>

</html>
