<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phswim</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <div id="controls">
        <h2>phswim</h2>
        <button onclick="changeSpeed(0.04)">速度: 1</button>
        <button onclick="changeSpeed(0.08)">速度: 2</button>
        <button onclick="changeSpeed(0.10)">速度: 3</button>
        <button onclick="moveForward(10)">前進</button>
        <button onclick="resetAnimation()">リセット</button>
    </div>

    <div id="inputs">
        <p>
            <label for="high">身長　　　　　　　</label>
            <input type="text" name="high" id="high" placeholder="120 - 220 cm">
        </p>
        <p>
            <label for="weight">体重　　　　　　　</label>
            <input type="text" name="weight" id="weight" placeholder="30 - 120 kg">
        </p>
        <p>
            <label for="strt">ストロークテンポ　</label>
            <input type="text" name="strt" id="strt" placeholder="0.3 - 2.0 回/s">
        </p>
        <p>
            <label for="strl">ストローク長　　　</label>
            <input type="text" name="strl" id="strl" placeholder="0.3 - 2.0 m/回">
        </p>
    </div>

    <div id="result">速度: 0 m/s<br> 50m time: 0s<br> 抵抗力 R: 0 N<br>パワー P: 0 W<br>ストロークテンポ: 0 回/s<br>角速度(speed):0 rad/fps
    </div>

    <!-- 結果出力ボタンを追加 -->
    <button id="output-btn" onclick="calculateAndDisplayResults()">結果出力</button>


    <canvas id="graph" width="1250" height="600"></canvas>
    <script src="strokepng.js"></script>
</body>

</html>
