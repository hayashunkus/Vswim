<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>phswim_move</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <h2>phswim_move</h2>
    </div>
    <div>
        <button onclick="changeSpeed(0.04)">速度: 1</button>
        <button onclick="changeSpeed(0.08)">速度: 2</button>
        <button onclick="changeSpeed(0.12)">速度: 3</button>
    </div>

    <p>
        <label for="high">身長　　　　　　　</label>
        <input type="text" name="high" id="high" placeholder="120 - 220 cm">
    </p>
    <p>
        <label for="weight">体重　　　　　　　</label>
        <input type="text" name="weight" id="weight" placeholder="30 - 120 kg">
    </p>
    <p>
        <label for="strt">ストロークテンポ　</label>
        <input type="text" name="strt" id="strt" placeholder="0.3 - 2.0 回/s">
    </p>
    <p>
        <label for="strl">ストローク長　　　</label>
        <input type="text" name="strl" id="strl" placeholder="0.3 - 2.0 m/回">
    </p>

    <!-- 計算結果を表示するエリア -->
    <div id="result">速度: 0 m/s<br> 抵抗力 R: 0 N<br>パワー P: 0 W<br>ストロークテンポ: 0 回/s<br>角速度(speed):0 rad/fps</div>

    <!-- 結果出力ボタンを追加 -->
    <button onclick="calculateAndDisplayResults()">結果出力</button>

    <canvas id="graph" width="1240" height="800"></canvas>
    <!--<script src="stroke2.js"></script>-->
    <script src="stroke_ob.js"></script>
</body>

</html>
